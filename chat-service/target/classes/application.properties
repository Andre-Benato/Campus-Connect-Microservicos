spring.application.name=chat-service
server.port=${SERVER_PORT:8080}

# ---------------------------------------------------------------------------
# MongoDB — mensagens do chat (Spring Boot 4: spring.mongodb.uri).
# ---------------------------------------------------------------------------
spring.mongodb.uri=${CHAT_MONGODB_URI:mongodb://localhost:27017/campusconnect_chat}
spring.data.mongodb.auto-index-creation=true

# ---------------------------------------------------------------------------
# Microservico de usuario/auth. O chat valida JWT apenas via HTTP.
# ---------------------------------------------------------------------------
campusconnect.user-service.base-url=${USER_SERVICE_URL:http://localhost:8081}

# ---------------------------------------------------------------------------
# Azure Service Bus — consome RideRequestAccepted e cria mensagem automatica.
# Sem connection string o consumer nao inicia (dev/local).
# ---------------------------------------------------------------------------
campusconnect.servicebus.connection-string=${AZURE_SERVICEBUS_CONNECTION_STRING:}
campusconnect.servicebus.queue-ride-request-accepted=${AZURE_SERVICEBUS_QUEUE_RIDE_REQUEST_ACCEPTED:ride-request-accepted}

# ---------------------------------------------------------------------------
# OpenAPI / Swagger UI
# ---------------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
