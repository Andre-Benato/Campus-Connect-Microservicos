spring.application.name=apartment-service
server.port=${SERVER_PORT:8080}

# ---------------------------------------------------------------------------
# Banco de dados do microservico de apartamentos (separado do user-service).
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:sqlserver://campus-conect.database.windows.net:1433;database=cloud_campus_conect_apartment;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------------------------------------------------------------------------
# Microservico de usuario/auth. O apartment valida JWT apenas via HTTP.
# ---------------------------------------------------------------------------
campusconnect.user-service.base-url=${USER_SERVICE_URL:http://localhost:8081}

# ---------------------------------------------------------------------------
# OpenAPI / Swagger UI
# ---------------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
