spring.application.name=carona-service
server.port=${SERVER_PORT:8080}

# ---------------------------------------------------------------------------
# Banco de dados do microservico de caronas (separado dos demais).
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:sqlserver://campus-conect.database.windows.net:1433;database=cloud_campus_conect_carona;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------------------------------------------------------------------------
# Microservico de usuario/auth. O carona-service valida JWT apenas via HTTP.
# ---------------------------------------------------------------------------
campusconnect.user-service.base-url=${USER_SERVICE_URL:http://localhost:8081}

# ---------------------------------------------------------------------------
# Azure Service Bus — publica RideRequestAccepted apos aceitar solicitacao.
# Sem connection string o publisher apenas loga (dev/local).
# ---------------------------------------------------------------------------
campusconnect.servicebus.connection-string=${AZURE_SERVICEBUS_CONNECTION_STRING:}
campusconnect.servicebus.queue-ride-request-accepted=${AZURE_SERVICEBUS_QUEUE_RIDE_REQUEST_ACCEPTED:ride-request-accepted}

# ---------------------------------------------------------------------------
# OpenAPI / Swagger UI
# ---------------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
