spring.application.name=user-service
server.port=${SERVER_PORT:8081}

# ---------------------------------------------------------------------------
# Banco de dados (Azure SQL Database). Todos os valores aceitam variavel de ambiente.
#
# Autenticacao SQL: usuario e senha vem sempre do ambiente (.env), nunca daqui.
# Os defaults abaixo servem so para documentar o formato -- sem DB_USERNAME e
# DB_PASSWORD definidos a aplicacao nao conecta, e isso e proposital.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:sqlserver://campus-conect.database.windows.net:1433;database=cloud_campus_conect_user;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# O schema e versionado pelo Flyway; o Hibernate nao deve alterar a estrutura.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------------------------------------------------------------------------
# Hash de senha (BCrypt + secret da aplicacao).
# O default abaixo serve apenas para desenvolvimento local; em producao defina
# a variavel de ambiente CAMPUSCONNECT_PASSWORD_SECRET.
# ---------------------------------------------------------------------------
campusconnect.security.password.secret=${CAMPUSCONNECT_PASSWORD_SECRET:campus-connect-dev-secret-trocar-em-producao}
campusconnect.security.password.strength=${CAMPUSCONNECT_PASSWORD_STRENGTH:10}

# ---------------------------------------------------------------------------
# Autenticacao JWT (RF02).
# O secret abaixo serve apenas para desenvolvimento local; em producao defina a
# variavel de ambiente CAMPUSCONNECT_JWT_SECRET (minimo de 32 caracteres, pois o
# HS256 exige uma chave de 256 bits).
# ---------------------------------------------------------------------------
campusconnect.security.jwt.secret=${CAMPUSCONNECT_JWT_SECRET:campus-connect-dev-jwt-secret-trocar-em-producao}
campusconnect.security.jwt.expiration=${CAMPUSCONNECT_JWT_EXPIRATION:5h}
campusconnect.security.jwt.issuer=${CAMPUSCONNECT_JWT_ISSUER:campus-connect}
# Periodo de limpeza dos tokens revogados que ja expiraram.
campusconnect.security.jwt.cleanup-interval=${CAMPUSCONNECT_JWT_CLEANUP_INTERVAL:1h}

# ---------------------------------------------------------------------------
# OpenAPI / Swagger UI
# ---------------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
